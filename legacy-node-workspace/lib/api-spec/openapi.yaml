openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bazaar e-commerce catalog and order API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product discovery
  - name: orders
    description: Customer orders
  - name: dashboard
    description: Store insights
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: featured
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Product not found
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List product categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get store dashboard summary
      responses:
        "200":
          description: Store summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderInput" }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, name, category, price, image, description, rating, reviews, badge, colors, sizes]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        image: { type: string }
        description: { type: string }
        rating: { type: number }
        reviews: { type: integer }
        badge: { type: ["string", "null"] }
        featured: { type: boolean }
        colors:
          type: array
          items: { type: string }
        sizes:
          type: array
          items: { type: string }
    Category:
      type: object
      required: [id, name, count, image]
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer }
        image: { type: string }
    DashboardSummary:
      type: object
      required: [totalProducts, totalOrders, totalRevenue, conversionRate]
      properties:
        totalProducts: { type: integer }
        totalOrders: { type: integer }
        totalRevenue: { type: number }
        conversionRate: { type: number }
    OrderInput:
      type: object
      required: [customerName, email, address, city, items, total]
      properties:
        customerName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        address: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        phone: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItemInput" }
        total: { type: number }
    OrderItemInput:
      type: object
      required: [productId, quantity, price]
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
        price: { type: number }
    Order:
      type: object
      required: [id, status, customerName, total, createdAt]
      properties:
        id: { type: string }
        status: { type: string }
        customerName: { type: string }
        total: { type: number }
        createdAt: { type: string }

