services:
  - type: web
    name: test-laravel
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: test-laravel
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: test-laravel-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: test-laravel-db
          property: connectionString

databases:
  - name: test-laravel-db
    plan: free
    region: frankfurt
